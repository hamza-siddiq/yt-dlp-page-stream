[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-dlp-page-stream"
version = "2.2.5"
description = "Plugin for yt-dlp: HLS/MP4 from video pages with Referer headers. Includes yt-dlp-ps, which runs full yt-dlp with the plugin enabled."
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["rich>=13.7.0", "certifi>=2024.2.2"]
license = { text = "MIT" }
keywords = ["yt-dlp", "yt-dlp-plugin", "m3u8", "hls", "mp4", "referer", "page-stream"]

[project.urls]
Homepage = "https://github.com/hamza-siddiq/yt-dlp-page-stream"
Repository = "https://github.com/hamza-siddiq/yt-dlp-page-stream"
Issues = "https://github.com/hamza-siddiq/yt-dlp-page-stream/issues"

[project.scripts]
yt-dlp-ps = "yt_dlp_page_stream:main"
yt-dlp-page-stream = "yt_dlp_page_stream:main"
page-stream-yt-dlp = "yt_dlp_page_stream:main"
page-stream-extract = "convert_links:main"
convert-links = "convert_links:main"

[tool.setuptools]
py-modules = ["cli_ui", "clipboard_input", "convert_links", "yt_dlp_page_stream", "update_check", "ytdlp_runtime"]

[tool.setuptools.packages.find]
where = ["."]
include = ["extractor*", "yt_dlp_plugins*"]
namespaces = true

[tool.setuptools.package-data]
yt_dlp_plugins = ["**/*.py"]
